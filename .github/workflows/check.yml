# Runs the plugin's own deterministic check suite on every pull request to main.
#
# The command is the one README § Repository validation documents for a pre-PR run:
#   node scripts/check.ts --strict
# --strict makes a skipped suite a failure (the hooks suite skips itself without jq),
# so a green run means every suite ran and passed. No dependencies are installed —
# the suite needs only Node.js, git, jq and bash, all present on GitHub-hosted Ubuntu
# runners. Nothing is built, published or deployed, and no secret is used.
name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  strict:
    name: Strict suite (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The supported Node.js versions (README § Requirements): the minimum on the
        # Node 22 line, and the current Node 24 LTS.
        node: ["22.18.0", "24"]
    env:
      # The suite creates throwaway git repositories and commits in them.
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Tool versions
        run: |
          node --version
          git --version
          jq --version
          bash --version | head -1
      - name: Strict check suite
        run: node --no-warnings scripts/check.ts --strict
